<!doctype html><html><head><meta charset="utf-8"><title>DOOM on Sheeternetes</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#c{width:100vw;height:100vh}</style>
<script src="https://js-dos.com/6.22/current/js-dos.js"></script></head>
<body><canvas id="c"></canvas>
<script>
  // js-dos boots the shareware DOOM. Needs internet for the js-dos lib;
  // vendor js-dos.js + a WAD next to this file for a fully air-gapped image.
  Dos(document.getElementById("c")).ready((fs, main) =>
    fs.extract("https://js-dos.com/6.22/current/test/doom.zip").then(() => main(["-c","DOOM.EXE"])));
</script></body></html>
